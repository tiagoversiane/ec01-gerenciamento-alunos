<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DevTech Academy - Gerenciamento de Alunos</title>
</head>
<body>
  <h1>DevTech Academy</h1>

  <h2>Cadastro de Alunos</h2>
  <form id="formulario-aluno">
    <p>
      <label for="nome">Nome:</label>
      <input type="text" id="nome" required pattern=".*\S.*" title="Informe o nome do aluno">
    </p>
    <p>
      <label for="idade">Idade:</label>
      <input type="number" id="idade" min="1" max="120" step="1" required>
    </p>
    <p>
      <label for="curso">Curso:</label>
      <select id="curso">
        <option value="JavaScript">JavaScript</option>
        <option value="Python">Python</option>
        <option value="Java">Java</option>
      </select>
    </p>
    <p>
      <label for="nota-final">Nota Final:</label>
      <input type="number" id="nota-final" min="0" max="10" step="0.01" required>
    </p>
    <button type="submit" id="botao-salvar">Cadastrar</button>
    <button type="button" id="botao-cancelar" hidden>Cancelar</button>
  </form>

  <h2>Alunos Cadastrados</h2>
  <table border="1">
    <thead>
      <tr>
        <th>Nome</th>
        <th>Idade</th>
        <th>Curso</th>
        <th>Nota Final</th>
        <th>Situação</th>
        <th>Ações</th>
      </tr>
    </thead>
    <tbody id="corpo-tabela"></tbody>
  </table>

  <h2>Relatórios</h2>
  <p>
    <button type="button" id="botao-aprovados">Alunos aprovados</button>
    <button type="button" id="botao-media-notas">Média das notas finais</button>
    <button type="button" id="botao-media-idades">Média das idades</button>
    <button type="button" id="botao-nomes">Nomes em ordem alfabética</button>
    <button type="button" id="botao-por-curso">Quantidade por curso</button>
  </p>
  <h3 id="titulo-relatorio">Selecione um relatório</h3>
  <ul id="lista-relatorio"></ul>

  <script src="js/Aluno.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
